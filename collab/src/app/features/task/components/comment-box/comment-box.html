
<div class="mt-6 border-t border-t-amber-950 ">
    <div class="font-semibold mb-2 my-2">
        <div>
            <h2>Comments:</h2>
            <div class="space-y-2 mb-3">
            @for (item of comments(); track $index) {
                <div class="bg-gray-100 p-2 rounded">
                    {{item.text}}
                </div>
            }
        </div>
        </div>

        <form (ngSubmit)="submit()" [formGroup]="form" class="flex gap-2">
            <input formControlName="text" type="type" class="w-full border-2 p-2 rounded-md flex-1" placeholder="Write a comment...">
            <button type="submit" class="btn">Send</button>
        </form>
    </div>
</div>
