<div>
    <div class="flex justify-between mb-4">
  <h2 class="text-xl font-bold">Projects</h2>
  <button class="btn" (click)="showForm = true">+ New Project</button>
  </div>

  @if (loading) {
    <div>Loading...</div>
  }
  <div class="grid">
    @for (project of projects; track project._id) {
      <div class="bg-white">
        <h3>{{ project.name }}</h3>
        <p>{{ project.description }}</p>
      </div>
    }
  </div>

@if (showForm) {
  <app-project-form (close)="closeDialog()" (created)="fetchProjects()" />
}

</div>
