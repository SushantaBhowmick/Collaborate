<div>
  <div class="flex justify-between mb-4">
    <h2 class="text-xl font-bold">Projects</h2>
    <button class="btn" (click)="showForm = true">+ New Project</button>
  </div>

  @if (loading$ | async) {
    <div>Loading...</div>
  }
  <div class="grid grid-cols-3 gap-5">
    @for (project of projects$ | async; track project._id) {
      <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg cursor-pointer transition" [routerLink]="['/projects',project._id]">
        <h3 class="text-lg font-semibold">{{ project.name }}</h3>
        <p class="text-sm text-gray-500 mt-2">{{ project.description }}</p>
      </div>
    }
  </div>

  @if (showForm) {
    <app-project-form (close)="closeDialog()" (created)="fetchProjects()" />
  }
</div>
