<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm"
  >
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
    <input
      type="email"
      placeholder="Email"
      formControlName="email"
      class="w-full mb-3 p-2 border rounded"
    />
    @if(form.get('email')?.invalid && form.get('email')?.touched){
        <span class="text-red-500">Invalid email</span>
    }
    <input
      type="password"
      placeholder="Password"
      formControlName="password"
      class="w-full mb-3 p-2 border rounded"
    />
       @if(form.get('password')?.invalid && form.get('password')?.touched){
        <span class="text-red-500">Password required</span>
    }
    <button
      [disabled]="loading"
      class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
    >
      {{loading? 'Logging in...':'Login'}}
    </button>
    <div class="text-end">New User? <button class="text-blue-700 cursor-pointer" [routerLink]="['/register']">Register</button></div>
    @if (error) {
      <p class="text-red-500">{{ error }}</p>
    }
  </form>
</div>
