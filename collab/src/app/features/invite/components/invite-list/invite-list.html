<div class="bg-white p-4 rounded shadow mt-4">
    <div class="flex items-center justify-between gap-2">
        <h3 class="font-semibold mb-3">Invites</h3>
        <button class="btn" (click)="showInviteForm = true">+ Invite Member</button>
    </div>


  @for (invite of invites(); track $index) {
    <div
       class="flex justify-between border-b py-2">

    <span>{{ invite.email }}</span>

    <span
      class="text-xs px-2 py-1 rounded"
      [ngClass]="{
        'bg-yellow-100 text-yellow-600': invite.status === 'PENDING',
        'bg-green-100 text-green-600': invite.status === 'ACCEPTED',
        'bg-red-100 text-red-600': invite.status === 'EXPIRED'
      }"
    >
      {{ invite.status }}
    </span>

  </div>
  }

</div>


  @if (showInviteForm) {
    <app-invite-form (close)="closeInviteForm()" />
  }
