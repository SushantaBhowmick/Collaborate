<div class="flex min-h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside
    [class.w-16]="isCollapsed()"
    [class.w-64]="!isCollapsed()"
    class="bg-gray-900 text-white transition-all duration-500 flex flex-col"
  >
    <div class="flex items-center justify-between p-2 mb-6">
     @if(!isCollapsed()){
       <h2 class="text-xl fonbol">Collab</h2>
     }
      <button (click)="toggleSidebar()" class="text-2xl">☰</button>
    </div>

    <nav class="space-y-2">
      <a [routerLink]="['/dashboard']" class="flex items-center gap-3 p-2 hover:bg-gray-700 rounded" (click)="setTitle('Dashboard')">
         <span class="text-2xl">📶</span>
         @if(!isCollapsed()){
          <span>Dasboard</span>
         }
      </a>
      <a [routerLink]="['/projects']" class="p-2 flex items-center gap-3 hover:bg-gray-700 rounded" (click)="setTitle('Projects')">
         <span class="text-2xl">📁</span>
         @if(!isCollapsed()){
          <span>Projects</span>
         }
      </a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col">
    <!-- MainContent -->
    <header class="bg-white shadow p-4 flex justify-between w-full">
      <h1 class="font-semibold">{{ title() }}</h1>
      <div class="flex items-end gap-5">
        <span class="font-bold">{{ user()?.name }}</span>
        <button class="text-red-500 cursor-pointer" (click)="logout()">Logout</button>
      </div>
    </header>

    <main class="p-6 bg-gray-100 flex-1 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
